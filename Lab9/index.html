<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Менеджер завдань LocalStorage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    
    <div class="header-title">
      📝 Менеджер завдань (Варіант 3)
    </div>

    <div class="form-container">
      <div class="form-group">
        <input type="text" id="task-input" placeholder="Введіть текст нового завдання...">
        <button id="btn-add-task" class="btn btn-add">Додати</button>
      </div>
    </div>

    <div class="list-container">
      <ul id="task-list"></ul>
    </div>

  </main>

  <script>
    const taskInput = document.getElementById('task-input');
    const btnAddTask = document.getElementById('btn-add-task');
    const taskList = document.getElementById('task-list');

    let tasks = JSON.parse(localStorage.getItem('user_tasks_v3')) || [];

    function saveTasks() {
      localStorage.setItem('user_tasks_v3', JSON.stringify(tasks));
    }

    function renderTasks() {
      taskList.innerHTML = '';

      const sortedTasks = [...tasks].sort((a, b) => b.timestamp - a.timestamp);

      sortedTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.dataset.id = task.id;

        li.innerHTML = `
          <div class="task-content">
            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}>
            <span class="task-text">${task.text}</span>
          </div>
          <button class="btn-delete">Видалити</button>
        `;

        taskList.appendChild(li);
      });
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (text === '') {
        alert('Неможливо додати порожнє завдання!');
        return;
      }

      const newTask = {
        id: Date.now().toString(),
        text: text,
        completed: false,
        timestamp: Date.now()
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();
      taskInput.value = '';
    }

    btnAddTask.addEventListener('click', addTask);

    taskInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    taskList.addEventListener('click', function(e) {
      const li = e.target.closest('.task-item');
      if (!li) return;
      const taskId = li.dataset.id;

      if (e.target.classList.contains('task-checkbox')) {
        tasks = tasks.map(task => {
          if (task.id === taskId) {
            return { ...task, completed: e.target.checked };
          }
          return task;
        });
        saveTasks();
        renderTasks();
      }

      if (e.target.classList.contains('btn-delete')) {
        tasks = tasks.filter(task => task.id !== taskId);
        saveTasks();
        renderTasks();
      }
    });

    window.addEventListener('DOMContentLoaded', renderTasks);
  </script>
</body>
</html>
