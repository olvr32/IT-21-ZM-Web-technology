<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма реєстрації</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="registration-container">
    <h2>Форма реєстрації</h2>
    
    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="username">Ім'я:</label>
        <input type="text" id="username">
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email">
      </div>

      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Повторіть пароль:</label>
        <input type="password" id="confirmPassword">
      </div>

      <div class="form-group">
        <label for="age">Вік:</label>
        <input type="number" id="age">
      </div>

      <div class="form-group">
        <label for="studentGroup">Група студентів:</label>
        <select id="studentGroup">
          <option value="">Оберіть групу...</option>
          <option value="IT-101">ІТ-11</option>
          <option value="IT-102">ІТ-21</option>
          <option value="IT-103">ІТ-31</option>
          <option value="IT-104">ІТ-41</option>
        </select>
      </div>

      <button type="submit">Зареєструватися</button>
    </form>
  </div>

  <script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {
      event.preventDefault();

      let username = document.getElementById("username").value.trim();
      let email = document.getElementById("email").value.trim();
      let password = document.getElementById("password").value;
      let confirmPassword = document.getElementById("confirmPassword").value;
      let age = document.getElementById("age").value;
      let studentGroup = document.getElementById("studentGroup").value;

      if (username === "") {
        alert("Поле імені не може бути порожнім!");
        return;
      }

      let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alert("Введіть коректну адресу електронної пошти!");
        return;
      }

      if (password.length < 6) {
        alert("Пароль має містити мінімум 6 символів!");
        return;
      }

      if (password !== confirmPassword) {
        alert("Паролі не збігаються!");
        return;
      }

      if (age === "" || Number(age) < 10) {
        alert("Вік повинен бути вказаний та бути не менше 10 років!");
        return;
      }

      if (studentGroup === "") {
        alert("Будь ласка, оберіть групу студентів!");
        return;
      }

      alert("Реєстрація успішна!");
      document.getElementById("registrationForm").reset();
    });
  </script>
</body>
</html>
